[package]
name = "graph-core"
version = "3.0.0"
authors = ["sreeise"]
edition = "2021"
license = "MIT"
repository = "https://github.com/sreeise/graph-rs-sdk"
description = "Common types and traits for the graph-rs-sdk crate"
homepage = "https://github.com/sreeise/graph-rs-sdk"

[dependencies]
async-trait = "0.1.35"
base64 = "0.22.0"
dyn-clone = "1.0.14"
heck = "0.5"
http = { workspace = true }
jsonwebtoken = "9.1.0"
parking_lot = "0.12.1"
reqwest = { workspace = true, default-features=false, features = ["json", "gzip", "stream"] }
graviola = "0.3.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = { version = "2", features = ["serde"] }

graph-error = { version = "1.0.0", path = "../graph-error"  }

[features]
default = ["native-tls"]
native-tls = ["reqwest/native-tls"]
rustls-tls = ["reqwest/rustls"]
brotli = ["reqwest/brotli"]
deflate = ["reqwest/deflate"]
trust-dns = ["reqwest/hickory-dns"]
socks = ["reqwest/socks"]
blocking = ["reqwest/blocking"]

[package.metadata.docs.rs]
features = ["native-tls", "deflate"]

[lints]
workspace = true
