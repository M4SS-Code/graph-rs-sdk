[package]
name = "graph-error"
version = "1.0.0"
authors = ["sreeise"]
edition = "2021"
license = "MIT"
repository = "https://github.com/sreeise/graph-rs-sdk"
description = "Graph Api error types and handling for the graph-rs-sdk crate"
homepage = "https://github.com/sreeise/graph-rs-sdk"

keywords = ["onedrive", "microsoft", "microsoft-graph", "api", "oauth"]
categories = ["authentication", "web-programming::http-client"]

[dependencies]
base64 = "0.22.0"
http = { workspace = true }
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }
reqwest = { workspace = true, default-features=false, features = ["json", "gzip", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.25.0", features = ["rt", "sync", "time"] }
url = "2"
uuid = { version = "1.3.1" }

[lints]
workspace = true
